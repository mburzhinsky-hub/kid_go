name: museums-probe

# Разовая сверка сайтов двух звенигородских музеев: что там написано про цены, часы и адрес. Результат — в аннотациях задачи.
on:
  push:
    branches: [ci/museums-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch sites
        shell: bash
        run: |
          python3 - <<'PY'
          import html, re, time, urllib.request, urllib.error, urllib.parse

          UA = "KidsGoFactCheck/1.0 (+https://kids-go.fun)"
          START = ["https://domcupca.ru/", "https://ussrmuseum.ru/", "https://ussrmuseum.ru/price-list/", "https://ussrmuseum.ru/contacts/"]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "ru,en;q=0.8"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  raw = r.read(2_500_000)
                  return r.status, r.geturl(), raw.decode("utf8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, url, ""
              except Exception as e:
                  return 0, url, repr(e)

          def text_of(h):
              h = re.sub(r"<(script|style|noscript|svg).*?</\1>", " ", h, flags=re.S | re.I)
              return html.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", h))).strip()

          c, base_final, home = get("https://domcupca.ru/")
          hrefs = []
          for href in re.findall(r'href="([^"#]+)"', home):
              u = urllib.parse.urljoin(base_final, href).split("#")[0]
              if urllib.parse.urlparse(u).netloc == "domcupca.ru" and not re.search(r"\.(jpg|jpeg|png|webp|gif|svg|pdf|css|js|ico|xml|woff2?|gz)$", u, re.I) and "/g/" not in u and "/thumb/" not in u and u not in hrefs:
                  hrefs.append(u)
          print("::notice title=domcupca links::" + " | ".join(hrefs)[:3000])
          for u in hrefs[:12]:
              time.sleep(1.5)
              c, final, h = get(u)
              t = text_of(h)
              title = (re.search(r"<title>(.*?)</title>", h, re.S) or [0, ""])[1].strip()
              print(f"::notice title=domcupca {urllib.parse.urlparse(u).path} [{c}] {title[:50]}::len={len(t)} %0A{t[:4500]}")
          PY
