name: Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Content trust validation
        run: npm run validate:data
      - name: Engine evaluation
        run: npm run eval
      - name: Scenario audit
        run: npm run audit:quick
      - name: District audit
        run: npm run audit:areas
      - name: Static production build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /kid_go
          NEXT_PUBLIC_SITE_URL: https://mburzhinsky-hub.github.io/kid_go
        run: |
          rm -rf src/app/api src/app/admin
          npm run build
