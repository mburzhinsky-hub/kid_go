name: Quality

on:
  push:
    branches: [fix/block-1-data-trust]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency advisory report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit installed production dependency versions
        run: npm audit --omit=dev --json
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Content trust validation
        run: npm run validate:data
      - name: Engine evaluation
        run: npm run eval
      - name: Scenario audit
        run: npm run audit:quick
      - name: District audit
        run: npm run audit:areas
      - name: Photo audit
        run: npm run audit:photos
      - name: Static production build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://kids-go.fun
        run: |
          rm -rf src/app/api src/app/admin
          npm run build
