name: Tmp site check
on:
  push:
    branches: [tmp-site-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Domain registration (RDAP)
        run: |
          curl -sSL -m 40 https://rdap.org/domain/kids-go.fun -o rdap.json -w 'http=%{http_code}\n'
          jq '{status: .status, events: [.events[]? | {a: .eventAction, d: .eventDate}], registrar: [.entities[]? | select(.roles[]?=="registrar") | .vcardArray[1][]? | select(.[0]=="fn") | .[3]], ns: [.nameservers[]?.ldhName]}' rdap.json || head -c 600 rdap.json
