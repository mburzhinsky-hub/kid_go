name: Deploy to hosting

# Выкладка сайта и API на хостинг reg.ru по FTPS. Пока запускается вручную (Actions → Deploy to hosting → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting
  cancel-in-progress: false

env:
  HOSTING_IP: 31.31.196.139   # адрес сайта на хостинге: проверяем его напрямую, пока домен ещё смотрит на GitHub
  SITE_DOMAIN: kids-go.fun

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: npm ci
      - name: Проверка секретов
        env:
          HOSTING_HOST: ${{ secrets.HOSTING_HOST }}
          HOSTING_USER: ${{ secrets.HOSTING_USER }}
          HOSTING_PASS: ${{ secrets.HOSTING_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          for v in HOSTING_HOST HOSTING_USER HOSTING_PASS DB_NAME DB_USER DB_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v (Settings → Secrets and variables → Actions)"; fail=1; fi
          done
          [ -z "${fail:-}" ]
      - name: Фотографии (копии на свой хостинг)
        run: node scripts/fetch-photos.mjs
      - name: Данные каталога для API (допустимые места, названия и фото для превью ссылок)
        run: npx tsx scripts/gen-api-data.ts
      - name: Сборка сайта
        env:
          NEXT_PUBLIC_PHOTOS_LOCAL: "1"
          NEXT_PUBLIC_ACCOUNTS: "1"   # кабинеты включены только там, где есть свой сервер API
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://kids-go.fun
        run: |
          npm run typecheck
          rm -rf src/app/api src/app/admin
          npm run build
      - name: Файл настроек API (config.php) из секретов
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Служебный токен (миграции и страница модерации). Если задан секрет ADMIN_TOKEN — токен постоянный, им входят на /api/moderation.php;
          # иначе на каждую выкладку создаётся одноразовый случайный токен, который никто не видит.
          if [ -n "${ADMIN_TOKEN_SECRET:-}" ]; then
            if [ "${#ADMIN_TOKEN_SECRET}" -lt 16 ]; then echo "::error::Секрет ADMIN_TOKEN слишком короткий: нужно не меньше 16 символов"; exit 1; fi
            ADMIN_TOKEN="$ADMIN_TOKEN_SECRET"
          else
            ADMIN_TOKEN=$(openssl rand -hex 24)
          fi
          echo "::add-mask::$ADMIN_TOKEN"
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          export ADMIN_SHA=$(printf %s "$ADMIN_TOKEN" | sha256sum | cut -d' ' -f1)
          mkdir -p build-api
          php -r '
            $c = [
              "env" => "production",
              "site_url" => "https://kids-go.fun",
              "db" => ["host" => "127.0.0.1", "port" => 3306, "name" => getenv("DB_NAME"), "user" => getenv("DB_USER"), "pass" => getenv("DB_PASS")],
              "app_secret" => hash("sha256", "kidsgo|" . getenv("DB_PASS")),
              "admin_token_sha256" => getenv("ADMIN_SHA"),
            ];
            file_put_contents("build-api/config.php", "<?php\nreturn " . var_export($c, true) . ";\n");
          '
          php -l build-api/config.php
      - name: Загрузка на хостинг (FTPS)
        env:
          HOSTING_HOST: ${{ secrets.HOSTING_HOST }}
          HOSTING_USER: ${{ secrets.HOSTING_USER }}
          HOSTING_PASS: ${{ secrets.HOSTING_PASS }}
          # Отпечаток (SHA-1) сертификата FTP-сервера reg.ru: у него собственный выпускающий центр, поэтому сверяем отпечаток сами
          FTP_CERT_SHA1: "3B:A2:EE:65:C0:B3:9E:7B:73:41:9C:60:85:51:49:BC:AC:DB:82:9E"
        run: |
          sudo apt-get install -y lftp >/dev/null
          FP=$(echo | openssl s_client -starttls ftp -connect "$HOSTING_HOST:21" -servername "$HOSTING_HOST" 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2 || true)
          if [ "$FP" != "$FTP_CERT_SHA1" ]; then echo "::error::Сертификат FTP-сервера не совпал с ожидаемым (получен: ${FP:-нет}). Выкладка остановлена."; exit 1; fi
          cat > lftp.cmd <<'CMD'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit yes
          mirror -R --delete --parallel=4 --exclude '^photos/' --exclude '^api/' --exclude '^\.well-known/' --exclude '^cgi-bin/' out/ /
          mirror -R --only-missing --parallel=4 out/photos/ /photos/
          mirror -R --delete --parallel=2 --exclude '^config\.php$' --exclude '^uploads/' --exclude '^tests/' --exclude '^README\.md$' --exclude '^config\.example\.php$' api/ /api/
          put -O /api build-api/config.php
          CMD
          if ! lftp -u "$HOSTING_USER","$HOSTING_PASS" "$HOSTING_HOST" -e "source lftp.cmd; bye" > lftp.out 2>&1; then
            echo "::error::Загрузка по FTPS не удалась. Последние строки: $(tail -n 6 lftp.out | tr '\n' '|' | cut -c1-600)"
            exit 1
          fi
          echo "Загрузка завершена"

      - name: Миграции базы и проверка
        run: |
          # Пока домен смотрит на GitHub Pages, на хостинге ещё нет сертификата Let's Encrypt (он выпускается после переключения DNS) — проверяем по IP хостинга без проверки сертификата.
          R="--resolve ${SITE_DOMAIN}:443:${HOSTING_IP} --insecure"
          code=$(curl -sS $R -o mig.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "https://${SITE_DOMAIN}/api/v1/admin/migrate" 2>curl.err || true)
          echo "migrate: HTTP $code"; cat mig.json || true; echo
          [ "$code" = "200" ] || { echo "::error::Миграции не применились (HTTP $code): $(head -c 300 mig.json) curl: $(head -c 300 curl.err)"; exit 1; }
          code=$(curl -sS $R -o health.json -w '%{http_code}' "https://${SITE_DOMAIN}/api/v1/health?deep=1" || true)
          echo "health: HTTP $code"; cat health.json; echo
          [ "$code" = "200" ] || { echo "::error::API не отвечает (HTTP $code): $(head -c 300 health.json)"; exit 1; }
          code=$(curl -sS $R -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}/")
          [ "$code" = "200" ] || { echo "::error::Главная страница на хостинге не открывается (HTTP $code)"; exit 1; }
          # короткая ссылка на подборку: несуществующий код должен отдать нашу страницу с пометкой «не найдена» (а не общую 404 сервера)
          code=$(curl -sS $R -o page.html -w '%{http_code}' "https://${SITE_DOMAIN}/c/zzzzzzzzzz/" || true)
          if [ "$code" != "404" ] || ! grep -q 'Подборка не найдена' page.html; then echo "::error::Короткая ссылка /c/<код>/ не работает (HTTP $code)"; exit 1; fi
          # модерация: служебные адреса закрыты без токена, страница модератора на месте
          code=$(curl -sS $R -o /dev/null -w '%{http_code}' "https://${SITE_DOMAIN}/api/v1/admin/reports" || true)
          [ "$code" = "403" ] || { echo "::error::Очередь жалоб без токена должна отвечать 403, а ответила HTTP $code"; exit 1; }
          code=$(curl -sS $R -o mod.html -w '%{http_code}' "https://${SITE_DOMAIN}/api/moderation.php" || true)
          if [ "$code" != "200" ] || ! grep -q 'Модерация · Kids Go' mod.html; then echo "::error::Страница модератора /api/moderation.php не открывается (HTTP $code)"; exit 1; fi
          # www → основной адрес (не критично: сертификат и алиас www настраиваются в панели хостинга)
          hdr=$(curl -sS --resolve "www.${SITE_DOMAIN}:443:${HOSTING_IP}" --insecure -o /dev/null -D - "https://www.${SITE_DOMAIN}/c/zzzzzzzzzz/?x=1" || true)
          if echo "$hdr" | head -1 | grep -q ' 301' && echo "$hdr" | grep -qi "^location: https://${SITE_DOMAIN}/c/zzzzzzzzzz/?x=1"; then echo "www → ${SITE_DOMAIN}: редирект работает"; else echo "::warning::Редирект www.${SITE_DOMAIN} → ${SITE_DOMAIN} не подтвердился: $(echo "$hdr" | head -3 | tr '\r\n' '  ')"; fi
