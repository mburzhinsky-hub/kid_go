name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Engine evaluation (0 нарушений, разнообразие, полнота дня)
        run: npm run eval
      - name: Audit of scenarios and filters (77 сценариев × условия × режимы места)
        run: npm run audit:quick
      - name: Audit of districts (все 11 округов, все экраны - подбор дня, «для вас», замена шага, приключения)
        run: npm run audit:areas
      - name: Audit of places (поля, часы, возраст, координаты, округ, дубли, приключения, афиша)
        run: npm run audit:places
      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          rm -rf src/app/api   # серверные API-роуты не нужны в статической выгрузке
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
