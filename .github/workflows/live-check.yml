name: live-check

# Проверка боевого сайта после выкладки: вернулись ли новые часы и цены в страницы мест.
on:
  push:
    branches: [ci/live-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live pages
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request
          def page(slug):
              req = urllib.request.Request(f"https://kids-go.fun/places/{slug}/", headers={"User-Agent": "KidsGoLiveCheck/1.0"})
              return urllib.request.urlopen(req, timeout=30).read().decode("utf8", "replace").replace('\\"', '"')
          html = page("moskvarium")
          import re
          m = [x.start() for x in re.finditer(r'opening_hours', html)]
          print(f"::notice title=moskvarium opening_hours entries::{len(m)}")
          for k in m[:2]:
              print(f"::notice title=moskvarium ctx::{html[k:k+260]}")
          for pat in ['Пн–Вс', 'круглосуточ', '10:00–22:00', 'закрыто', 'Пн закрыто']:
              print(f"::notice title=moskvarium has {pat}::{pat in html}")
          PY
