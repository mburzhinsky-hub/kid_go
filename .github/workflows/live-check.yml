name: live-check

# Проверка боевого сайта после выкладки: файл и метатег подтверждения Яндекс.Вебмастера. Результат — в аннотациях задачи.
on:
  push:
    branches: [ci/live-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait for deploy and check
        shell: bash
        run: |
          python3 - <<'PY'
          import re, sys, time, urllib.request, urllib.error

          SITE = "https://kids-go.fun"
          CODE = "ecb6d0a4889299b5"
          UA = "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)"

          def get(path):
              req = urllib.request.Request(SITE + path, headers={"User-Agent": UA})
              try:
                  r = urllib.request.urlopen(req, timeout=40)
                  return r.status, r.read().decode("utf8", "replace"), r.headers.get("Content-Type", "")
              except urllib.error.HTTPError as e:
                  return e.code, "", ""
              except Exception:
                  return 0, "", ""

          deadline = time.time() + 42 * 60
          while time.time() < deadline:
              code, body, ct = get(f"/yandex_{CODE}.html")
              if code == 200 and CODE in body:
                  break
              time.sleep(60)

          bad = []
          code, body, ct = get(f"/yandex_{CODE}.html")
          print(f"::notice title=file::code={code} type={ct} body={body.strip()[:200]!r}")
          if code != 200 or f"Verification: {CODE}" not in body:
              bad.append("файл подтверждения не отдаётся")
          for path in ["/", "/kuda-shodit/", "/places/vdnh/"]:
              c, h, _ = get(path)
              m = re.search(r'<meta name="yandex-verification" content="([^"]*)"', h)
              print(f"::notice title=meta {path}::code={c} tag={m.group(1) if m else None}")
              if c != 200 or not m or m.group(1) != CODE:
                  bad.append(f"{path}: метатега нет")
          c, h, _ = get("/robots.txt")
          print(f"::notice title=robots::code={c} sitemap={'sitemap.xml' in h}")
          c, h, _ = get("/sitemap.xml")
          print(f"::notice title=sitemap::code={c} urls={h.count('<loc>')}")
          for b in bad:
              print(f"::error title=problem::{b}")
          if not bad:
              print("::notice title=result::файл и метатег на месте")
          sys.exit(1 if bad else 0)
          PY
