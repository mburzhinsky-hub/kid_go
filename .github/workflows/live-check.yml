name: live-check

# Проверка боевого сайта после выкладки: канонические адреса служебных страниц и noindex у офлайн-страницы.
on:
  push:
    branches: [ci/live-check]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Wait for deploy to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 3); do
            s=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-hosting.yml/runs?per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            echo "deploy: $s"
            case "$s" in completed*) break;; esac
            sleep 60
          done
          echo "::notice title=deploy::$s"
      - name: Check live pages
        shell: bash
        run: |
          python3 - <<'PY'
          import re, sys, urllib.request, urllib.error

          SITE = "https://kids-go.fun"
          UA = "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"

          def get(path):
              req = urllib.request.Request(SITE + path, headers={"User-Agent": UA})
              try:
                  r = urllib.request.urlopen(req, timeout=40)
                  return r.status, r.read().decode("utf8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  print(f"::warning title=exc {path}::{type(e).__name__}: {str(e)[:150]}")
                  return 0, ""

          bad = []
          for p in ["/planner/", "/photo-credits/", "/privacy/", "/rules/"]:
              c, h = get(p)
              m = re.search(r'<link rel="canonical" href="([^"]*)"', h)
              print(f"::notice title=canonical {p}::code={c} canonical={m.group(1) if m else None}")
              if c != 200 or not m or m.group(1) != SITE + p:
                  bad.append(f"{p}: canonical {m.group(1) if m else None}")
          c, h = get("/offline.html")
          print(f"::notice title=offline::code={c} noindex={'noindex' in h}")
          if c != 200 or "noindex" not in h:
              bad.append("offline.html: нет noindex")
          # остальное не сломалось
          for p in ["/", "/kuda-shodit/", "/places/vdnh/", "/sitemap.xml", "/yandex_ecb6d0a4889299b5.html"]:
              c, h = get(p)
              if c != 200:
                  bad.append(f"{p}: HTTP {c}")
          for b in bad:
              print(f"::error title=problem::{b}")
          if not bad:
              print("::notice title=result::всё на месте")
          sys.exit(1 if bad else 0)
          PY
