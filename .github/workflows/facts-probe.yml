name: facts-probe

# Сверка часов, цен и адресов с официальными сайтами мест. Результат — tmp_verify/pages/*.json в этой же ветке.
on:
  push:
    branches: [ci/facts-probe]
    paths: [scripts/fetch-targets.mjs, tmp_verify/targets.json, .github/workflows/facts-probe.yml]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        run: node scripts/fetch-targets.mjs
      - name: Save result to branch
        run: |
          git config user.name "facts-probe"
          git config user.email "noreply@github.com"
          git add tmp_verify/pages
          git commit -m "facts-probe: страницы второй сверки"
          git push origin HEAD:ci/facts-probe
