name: Verify patched MapLibre candidate

on:
  push:
    branches: [fix/block-1-data-trust]
    paths: [.github/workflows/maplibre-candidate.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve the first patched version without publishing changes
        run: npm install --save-exact --ignore-scripts maplibre-gl@6.4.1
      - name: Prepare offline integration workspace
        run: tar --exclude=.git --exclude=.next --exclude=out --exclude='*.tsbuildinfo' -czf /tmp/kidgo-candidate.tar.gz .
      - name: Export generated manifests and test workspace
        uses: actions/upload-artifact@v4
        with:
          name: kidgo-patched-candidate
          path: /tmp/kidgo-candidate.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Audit the candidate dependency tree
        run: npm audit --omit=dev --json
      - name: Check integration types
        run: npm run typecheck
      - name: Check static web build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /kid_go
          NEXT_PUBLIC_SITE_URL: https://mburzhinsky-hub.github.io/kid_go
        run: |
          rm -rf src/app/api src/app/admin
          npm run build
