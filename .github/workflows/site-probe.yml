name: site-probe

# Диагностика: как kids-go.fun отвечает краулерам превью (Telegram, VK, WhatsApp, Facebook) и обычному браузеру.
# Запускается пушем в ветку ci/site-probe или вручную. Результат — в аннотациях задачи.
on:
  push:
    branches: [ci/site-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          SITE=https://kids-go.fun
          probe() {
            local name="$1" ua="$2" url="$3"; shift 3
            rm -f /tmp/body /tmp/hdr
            local w
            w=$(curl -sS -L --max-time 40 -A "$ua" "$@" -D /tmp/hdr -o /tmp/body \
              -w 'code=%{http_code} size=%{size_download} ttfb=%{time_starttransfer}s total=%{time_total}s http=%{http_version} ip=%{remote_ip} redirects=%{num_redirects} final=%{url_effective}' "$url" 2>&1) || true
            local hs
            hs=$(grep -iE '^(HTTP/|content-type|content-length|content-encoding|server|location|cache-control|set-cookie|via|x-|cf-)' /tmp/hdr 2>/dev/null | tr -d '\r' | tr '\n' '|' | cut -c1-700)
            local og
            og=$(head -c 65536 /tmp/body 2>/dev/null | grep -o '<meta property="og:[a-z:]*" content="[^"]\{0,60\}' | head -4 | tr '\n' ' ')
            echo "::notice title=probe $name::$w || $hs || og: ${og:-NONE}"
          }
          BROWSER='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          probe "browser /"            "$BROWSER" "$SITE/"
          probe "TelegramBot /"        'TelegramBot (like TwitterBot)' "$SITE/"
          probe "TelegramBot adventure" 'TelegramBot (like TwitterBot)' "$SITE/adventures/dozhdiku-nazlo"
          probe "vkShare /"            'Mozilla/5.0 (compatible; vkShare; +http://vk.com/dev/Share)' "$SITE/"
          probe "WhatsApp /"           'WhatsApp/2.23.20.0 A' "$SITE/"
          probe "facebook /"           'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)' "$SITE/"
          probe "TelegramBot og.jpg"   'TelegramBot (like TwitterBot)' "$SITE/og.jpg"
          probe "TelegramBot / http1.1+gzip" 'TelegramBot (like TwitterBot)' "$SITE/" --http1.1 -H 'Accept-Encoding: gzip, deflate'
          probe "TelegramBot http://"  'TelegramBot (like TwitterBot)' "http://kids-go.fun/"
          probe "TelegramBot sitemap"  'TelegramBot (like TwitterBot)' "$SITE/sitemap.xml"
      - name: Sitemap and canonical
        shell: bash
        run: |
          set +e +o pipefail
          curl -sS --max-time 40 -A 'Googlebot/2.1' --compressed https://kids-go.fun/sitemap.xml -o /tmp/sm.xml
          total=$(grep -c '<loc>' /tmp/sm.xml)
          noslash=$(grep -o '<loc>[^<]*</loc>' /tmp/sm.xml | grep -vc '/</loc>')
          first=$(grep -o '<loc>[^<]*</loc>' /tmp/sm.xml | head -3 | tr '\n' ' ')
          echo "::notice title=live sitemap::urls=$total without_trailing_slash=$noslash first=$first"
          for u in https://kids-go.fun/ https://kids-go.fun/scenarios/ https://kids-go.fun/places/abramtsevo/; do
            c=$(curl -sS --max-time 40 --compressed "$u" | grep -o '<link rel="canonical" href="[^"]*"' | head -1)
            code=$(curl -sS --max-time 40 -o /dev/null -w '%{http_code}' "$u")
            echo "::notice title=live canonical::$u code=$code ${c:-NO-CANONICAL}"
          done
      - name: Robots and sitemap as Googlebot
        shell: bash
        run: |
          set +e +o pipefail
          UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          for u in https://kids-go.fun/robots.txt https://kids-go.fun/sitemap.xml; do
            h=$(curl -sS --max-time 40 -A "$UA" -D - -o /tmp/b "$u" | tr -d '\r' | grep -iE '^(HTTP/|content-type|content-length|content-encoding|x-robots-tag|last-modified|etag|cache-control)' | tr '\n' '|')
            echo "::notice title=googlebot $u::$h size=$(wc -c </tmp/b)"
          done
          curl -sS --max-time 40 -A "$UA" https://kids-go.fun/robots.txt | head -20 | tr '\n' '|' | sed 's/^/::notice title=robots body::/'
          echo
          lm=$(curl -sS --max-time 40 -A "$UA" https://kids-go.fun/sitemap.xml | grep -o '<lastmod>[^<]*' | sort -u | head -3 | tr '\n' ' ')
          echo "::notice title=sitemap lastmod::$lm runner_date=$(date -u +%FT%TZ)"
          # хвост файла: нет ли обрыва
          curl -sS --max-time 40 -A "$UA" https://kids-go.fun/sitemap.xml | tail -c 200 | tr '\n' ' ' | sed 's/^/::notice title=sitemap tail::/'
          echo
          python3 - <<'PY'
          import urllib.request, xml.dom.minidom
          r=urllib.request.Request('https://kids-go.fun/sitemap.xml',headers={'User-Agent':'Googlebot/2.1'})
          d=urllib.request.urlopen(r,timeout=40).read()
          xml.dom.minidom.parseString(d)
          print('::notice title=sitemap xml parse::OK bytes=%d'%len(d))
          PY
      - name: Live site button
        shell: bash
        run: |
          set +e +o pipefail
          for s in kidzania-aviapark depo-food-hall tsaritsyno-verevochny-park air-arena-rigamoll termy-odintsovo skalodrom-skala-siti misti-park-odintsovo hippo-land-odintsovo muzey-nazad-v-sssr-zvenigorod muzey-lego-lets-go-zvenigorod unaboom-odintsovo mega-himki-detskie-zony ribambelle-vremena-goda littles-kids-play-cafe vasilchuki-chaihona-afimall vasilchuki-chaihona-dmitriya-ulyanova vasilchuki-chaihona-metropolis abramtsevo; do
            html=$(curl -sS --max-time 40 --compressed "https://kids-go.fun/places/$s/")
            has=$(echo "$html" | grep -c 'Сайт места')
            href=$(echo "$html" | grep -o '<a href="[^"]*"[^>]*rel="noopener"[^>]*>' | head -1 | grep -o 'href="[^"]*"')
            echo "::notice title=live site-button $s::button=$has $href"
          done
      - name: Live site button summary
        shell: bash
        run: |
          set +e +o pipefail
          ok=""; miss=""
          for s in unaboom-odintsovo mega-himki-detskie-zony ribambelle-vremena-goda littles-kids-play-cafe vasilchuki-chaihona-afimall vasilchuki-chaihona-dmitriya-ulyanova vasilchuki-chaihona-metropolis abramtsevo; do
            n=$(curl -sS --max-time 40 --compressed "https://kids-go.fun/places/$s/" | grep -c 'Сайт места')
            if [ "$n" -gt 0 ]; then ok="$ok $s"; else miss="$miss $s"; fi
          done
          echo "::notice title=live site-button summary::WITH:$ok || WITHOUT:$miss"
      - name: Live venues check
        shell: bash
        run: |
          set +e +o pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          out=""
          for h in kidzaniamoscow.ru depomoscow.ru tsaritsyno-museum.ru airarena.ru therms.ru skala-city.ru mistyparkodi.ru hippo-land.ru ussrmuseum.ru letsgo-museum.ru unaboom.ru star-lab.org ribambelle.ru littleskids.com chaihona.ru; do
            body=$(curl -sS -L --max-time 30 -A "$UA" -o /tmp/v.html -w '%{http_code} %{url_effective} %{time_total}s' "https://$h/" 2>&1)
            title=$(tr '\n' ' ' </tmp/v.html | grep -o '<title[^>]*>[^<]*' | head -1 | sed 's/<title[^>]*>//' | cut -c1-70)
            out="$out$h => $body | $title%0A"
          done
          echo "::notice title=live venues::%0A$out"
